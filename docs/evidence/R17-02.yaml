golden_policy: "Goldens are Swift values (DomainSchemaGoldens) written once to JSON and frozen; the test compares file == value and round-trips. Regenerate only on purpose with REGENERATE_GOLDENS=1. All golden data is SYNTHETIC_DEMO_ONLY: GTINs in GS1 in-store prefix 200 (never a real global product), invented brand/owner/merchant"
compatibility_cases:
  - "Forward: each golden decodes, validates, re-encodes to the same value with the same key names"
  - "Backward: every contract refuses schema_version+1 with SCHEMA_NEWER (never half-read)"
  - "Strict keys: every contract refuses an extra top-level key"
  - "Frozen enum raw values for all 21 new persisted enums"
  - "Migration: BodyProfile v1 -> BodyProfileV2 -> v1 exact over 300 generated bodies (cm and inch entries, slider and typed mixes)"
  - "Migration reader accepts a v1 file or a v2 file; refuses v3, a v1 file with an extra key, and garbage"
provenance_cases:
  - "No number without a source: physical points need source evidence; fabric evidence keys equal exactly the present attributes"
  - "A picture never gives material: composition origin list has no photo/image entry; appearance is a separate hint; synthetic/OCR-unconfirmed composition is never product fact"
  - "Wash temperature is care only: carried in FabricSpecV1/ThermalAdviceV1, never changes advice; no degree, digit or % in advice text without a measured interval backed by thermal test ids and weather evidence"
  - "No weather values without weather evidence"
  - "Slider shapes and starting values never become measurements in migration; photo estimates never reach size advice; a fit verdict may only rest on approved, typed measurements of the same body revision (STALE_REVISION otherwise)"
  - "One size (TRY_SIZE) only when every region in play was evaluated; 'proven' only with evidence in every region; otherwise limitations are required"
  - "Only G2 is a validated simulation; G1+ needs a licensed product asset revision; generated images are G3 only; try-on never informs size advice"
  - "Identity: exact match needs a code, evidence and check time; verified needs DISPLAY_FACTS and expires to BRAND_IDENTIFIABLE"
  - "Commerce: one GTIN or merchant SKU per variant; merchant SKU tied to its merchant; money in minor units + ISO currency; verified stock always carries an expiry and reads UNKNOWN after it; claim tier locked to the claimant; GS1 identity-only; price/stock only on offers; fact display only for tier A/B, licensed, active, in force"
property_tests:
