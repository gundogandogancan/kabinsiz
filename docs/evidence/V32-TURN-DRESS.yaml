measured_on_simulator:
  - "Bug found: on iOS 26 Entity.move(to:) left the pivot's transform owned by the animation; later transform/orientation writes read back as identity in the same frame. The value said 167°, the drawn figure never turned. macOS ran the same code fine. Fixed by easing turns in the scene's own frame tick."
  - "Hidden world: WorldStage.setPaused stops the frame tick while the profile cover or another tab is up (no flick, no rate report). Turning the scene's entities off, or remaking the RealityView, left new RealityViews undrawn on the simulator: rejected."
