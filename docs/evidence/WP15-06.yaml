residual_risks:
  - "All thresholds (battery 10/20 %, 20 s recovery, 60 s memory calm, camera 15/8/2) are hypotheses until measured on the paired iPhones (13 Pro Max, 14 Pro Max, 16 Pro) in WP15-18"
  - "Simulator never reports a non-nominal thermal state; real thermal transitions are REAL_DEVICE_BLOCKED"
  - "App saves are not yet wrapped in beginBackgroundTask/BackgroundWindow; vault writes are atomic so suspension cannot corrupt, but a queued save can be delayed until the next launch"
  - "EphemeralArea is wired and swept at launch but no feature writes temp files yet (camera import comes later)"
  - "ComputePlanner has no real model to place yet; Core ML compute-unit fallback is untested on device"
  - "Memory pressure 'critical' is never set by the iOS adapter (UIKit only sends warnings); a DispatchSource memory-pressure source can be added if measurements show it is needed"
