review_findings: 16   # 3 x P1, 13 x P2; no P0
review_fixes:
  - "P1-1 writes and deletes are must-complete (never abandoned for a deadline or cancellation); store claims the revision before its first await; after any failed write or delete the studio re-reads the store"
  - "P1-2 avatar-cache is LOCAL_SENSITIVE (geometry gives the measurements back); doc comment corrected; recoverability test"
  - "P1-3 breaker keyed per module+node, skips do not re-arm it, half-open probe after cooldown"
  - "P2 stale previews: app generation counter drops older previews; delete and close cancel the preview lane"
  - "P2 a module throwing CancellationError is a module failure (fallback applies, finished write counts); only the caller cancels a run"
  - "P2 createNeutral only from empty"
  - "P2 legacy migration decides out-of-range before writing; any other failure keeps the old record"
  - "P2 typed measurement locks its slider; 'Kaydırıcıyla şekillendir' turns it back into a shape on purpose (leaves size advice)"
  - "P2 committed scene drawn through the coordinator (budget decides LOD) instead of a direct render"
  - "P2 coordinator state changes go through the guarded TaskState machine"
  - "P2 VoiceOver: drawing reads the values (not a revision), fallback says the drawing is unavailable, slider hint names the half-cm step"
residual_risks:
  - "Revision floor does not survive delete + relaunch (in-memory); harmless today because the event journal is in-memory too (THREAT_MODEL T19)"
  - "Upstream node outputs are not policy-checked; graphs are built in code, not from input"
  - "Only COMMITTED and DELETED body events are emitted; MorphRequested/MorphValidated/SceneRendered (§105.2) are not separate events yet"
  - "UI test drags waist only and does not run with network denied; package tests cover offline budgets"
  - "No arm control yet (spec lists shoulder/arm/torso); comes with the 3D mesh (WP15-07/08)"
  - "No side-by-side compare view; ORC-07 has no real process restart (journal is in-process by §105.3)"
