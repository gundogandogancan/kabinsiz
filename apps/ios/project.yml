name: Kabinsiz
options:
  bundleIdPrefix: app.kabinsiz
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 47XQMQZLF6
    CODE_SIGN_STYLE: Automatic
packages:
  KabinsizCore:
    path: ../../Packages/KabinsizCore
targets:
  Kabinsiz:
    type: application
    platform: iOS
    sources:
      - path: Kabinsiz
    dependencies:
      - package: KabinsizCore
        product: DomainContracts
      - package: KabinsizCore
        product: WardrobeDomain
      - package: KabinsizCore
        product: LocalStore
      - package: KabinsizCore
        product: TravelEngine
      - package: KabinsizCore
        product: FitPassport
      - package: KabinsizCore
        product: ShoppingCopilot
      - package: KabinsizCore
        product: SystemContracts
      - package: KabinsizCore
        product: Vault
      - package: KabinsizCore
        product: BodyGeometry
      - package: KabinsizCore
        product: Octopus
      - package: KabinsizCore
        product: DesignTokens
      - package: KabinsizCore
        product: AvatarDressing
      - package: KabinsizCore
        product: TodayOutfit
      - package: KabinsizCore
        product: LiveMirror
      - package: KabinsizCore
        product: LivingWorld
      - package: KabinsizCore
        product: MorningReady
      - package: KabinsizCore
        product: ProductCapture
      - package: KabinsizCore
        product: SelfModel
      - package: KabinsizCore
        product: GarmentPattern
      - sdk: WeatherKit.framework
    info:
      path: Kabinsiz/Info.plist
      properties:
        CFBundleDisplayName: Kabinsiz
        UILaunchScreen:
          UIColorName: SurfaceBase
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.kabinsiz.ios.morning-refresh]
        NSLocationWhenInUseUsageDescription: "Yalnız \"Konumumdaki şehir\"e dokunduğunda, yaklaşık konumun telefonda en yakın şehri bulmak için kullanılır; saklanmaz ve gönderilmez."
        NSLocationDefaultAccuracyReduced: true
        NSCameraUsageDescription: "Canlı Ayna'da seçtiğin parçayı üzerinde görmek ve ürünün barkodunu ya da etiketini okumak için kamera görüntüsü yalnız bu iPhone'da işlenir; kaydedilmez ve gönderilmez."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kabinsiz.ios
        CODE_SIGN_ENTITLEMENTS: Kabinsiz/Kabinsiz.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  KabinsizUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KabinsizUITests
    dependencies:
      - target: Kabinsiz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kabinsiz.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kabinsiz
schemes:
  Kabinsiz:
    build:
      targets:
        Kabinsiz: all
        KabinsizUITests: [test]
    test:
      targets:
        - KabinsizUITests
